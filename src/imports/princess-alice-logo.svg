<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="#FF1493" stroke="#FF6B35" stroke-width="3"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="#00BFFF"/>
  
  <!-- House silhouette in center -->
  <path d="M100 50 L130 75 L130 110 L70 110 L70 75 Z" fill="#FFD700" stroke="#FF1493" stroke-width="2"/>
  <rect x="85" y="85" width="15" height="25" fill="#FF1493"/>
  <rect x="105" y="70" width="12" height="12" fill="#00BFFF"/>
  <rect x="83" y="70" width="12" height="12" fill="#00BFFF"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="85" stroke="#9D4EDD" stroke-width="2" fill="none"/>
  <circle cx="100" cy="100" r="65" stroke="#FFD700" stroke-width="2" fill="none"/>
  
  <!-- Text path for circular text -->
  <defs>
    <path id="circlePath" d="M 100, 100 m -90, 0 a 90,90 0 1,1 180,0 a 90,90 0 1,1 -180,0"/>
  </defs>
  <text fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
      PRINCESS ALICE ADOPTION HOME
    </textPath>
  </text>
</svg>
